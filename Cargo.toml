[package]
name = "plicopdf"
version = "0.1.0"
edition = "2024"
description = "Lightweight PDF editor: fill forms, sign, stamp, add text, rotate, reorder, insert, extract and replace pages."
license = "GPL-3.0-or-later"
repository = "https://github.com/eghignatti/plicopdf"

[dependencies]
chrono = "0.4.45"
# glow (OpenGL) e non wgpu: avvio più rapido, eseguibile più piccolo, gira anche su GPU datate.
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "links", "wayland", "x11"] }
egui-phosphor = "0.14.0"
hayro = "0.8.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
lopdf = "0.45.0"
rfd = "0.17.2"

# Il rendering PDF avviene su CPU: senza ottimizzazioni le build di sviluppo sono inutilizzabili.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
codegen-units = 1
strip = true
